name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-portaudio

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S bridge -B bridge/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build bridge/build
          ./bridge/bin/headset_bridge.exe --version

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/PhoneLinkHeadsetBridge"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item bridge/bin/headset_bridge.exe, bridge/bin/headset_bridge_gui.exe, bridge/bridge.example.ini, README.md, LICENSE, THIRD_PARTY_NOTICES.md $dir
          Copy-Item btstack/LICENSE "$dir/LICENSE-BTstack.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath dist/PhoneLinkHeadsetBridge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLinkHeadsetBridge
          path: dist/PhoneLinkHeadsetBridge

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $tag")
          if ($start -lt 0) { "Release $tag" | Set-Content dist/release-notes.md; exit 0 }
          $notes = @()
          for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith("## "); $i++) { $notes += $lines[$i] }
          $notes | Set-Content dist/release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Phone Link Headset Bridge ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: dist/PhoneLinkHeadsetBridge.zip
