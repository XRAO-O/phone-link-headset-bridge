# Phone Link headset bridge settings
# Copy this file to bridge.ini (next to headset_bridge.exe), or let the GUI create it for you.
# Device names are matched by case-insensitive substring. Run "headset_bridge.exe --list" to see them.

# Bluetooth address of the headset. Run "headset_bridge.exe --scan" to find it.
headset_address =

# Where the headset microphone is played. "CABLE Input" makes the mic appear in Windows as
# "CABLE Output (VB-Audio Virtual Cable)" - select that as the microphone for Phone Link.
mic_output_device = CABLE Input

# What the headset plays. Route Phone Link / PC audio to this device (e.g. a Voicemeeter bus).
speaker_input_device = Voicemeeter Out B1

# Volume adjustments in dB (e.g. 6 = louder, -6 = quieter)
mic_gain_db = 0
speaker_gain_db = 0

# Audio buffer in each direction. Raise it if you hear crackles, lower it for less delay.
latency_ms = 40

# Seconds between reconnect attempts while the headset is off or out of range
reconnect_interval_s = 5
